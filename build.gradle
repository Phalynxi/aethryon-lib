plugins { id 'java'; id 'maven-publish'; id 'net.neoforged.moddev' version '2.0.148' }
group = 'dev.phi'
version = '1.0'
base { archivesName = 'prismlib' }
tasks.withType(Jar).configureEach { archiveVersion = '' }   // the jar is named prismlib.jar; the version lives in neoforge.mods.toml
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = neo_version
    mods { prismlib { sourceSet sourceSets.main } }
}
processResources {
    inputs.property 'v', project.version
    filesMatching('META-INF/neoforge.mods.toml') { filter { line -> line.replace('@VERSION@', project.version.toString()) } }
}

java { withSourcesJar() }
publishing {
    publications { lib(MavenPublication) { from components.java; artifactId = 'prismlib' } }
    repositories { mavenLocal() }
}
